[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cinepilot-agent-service"
version = "0.1.0"
description = "CinePilot AI - Python ADK Agent Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.30.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "google-adk>=2.7.1",
    "google-genai>=2.20.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
